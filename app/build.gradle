plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dagen.arkanoid'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dagen.arkanoid'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // languages are switched inside the app, so every locale must stay in the base apk
    bundle {
        language {
            enableSplit = false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
